name: Publication preflight CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  public-calendar-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: npm install --ignore-scripts --no-save --package-lock=false playwright@1.62.1 leaflet@1.9.4
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test complete public calendar startup without production access
        env:
          TEST_OUTPUT: calendar-startup-evidence
        run: node scripts/test-calendar-startup.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-startup-evidence
          path: calendar-startup-evidence/
          if-no-files-found: ignore

  publication-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show preinstalled Node version
        run: node --version

      - name: Test Admin V11 session isolation
        run: |
          node scripts/test-admin-v11-session-resilience.mjs
          node scripts/test-admin-v11-late-requests.mjs
          node scripts/test-admin-v11-auth-shell-transition.mjs
          node scripts/test-admin-v11-jwt-expiry.mjs

      - name: Test batch limit and preflight
        run: node scripts/test-publication-batch-preflight.mjs

      - name: Test publication workflow safety
        run: node scripts/test-publication-workflow-safety.mjs

      - name: Test preserved Douai manual mode
        run: node scripts/test-publication-douai-manual.mjs

      - name: Test selected manual PREVIEW and EXECUTE
        run: node scripts/test-publication-manual-selected.mjs

      - name: Test publication incident observation
        run: node scripts/test-publication-incident-health.mjs

      - name: Test publication lifecycle recipes
        run: |
          python3 scripts/event-publisher/test-refresh-index.py
          python3 scripts/test-temporal-catalogues.py
          python3 scripts/test-temporal-delivery.py
          node scripts/test-publication-deployment.mjs
          python3 scripts/test-progressive-event-generator.py
          node scripts/test-targeted-publication.mjs
          node scripts/test-targeted-source-isolation.mjs
          node scripts/test-event-edit-canonical-cleanup.mjs
          node scripts/test-publication-jobs-canonical.mjs
          node scripts/test-post-validation-publication.mjs
          node scripts/test-author-event-auto-refresh.mjs
          node scripts/test-author-sitemap-lastmod.mjs
          node scripts/test-public-catalog.mjs
          node scripts/test-lorient-test-retirement.mjs
          node scripts/test-retired-test-policy.mjs
          node scripts/test-brive-edit.mjs
          node scripts/test-publication-workflow-safety.mjs

      - name: Test pending DELETE coalescence on disposable PostgreSQL
        run: bash scripts/test-p0c3c-delete-pending.sh

      - name: Test atomic batch reservation on disposable PostgreSQL
        run: bash scripts/test-publication-batch-state.sh

      - name: Test CANARY source, quota and incident on disposable PostgreSQL
        run: bash scripts/test-publication-canary-sql.sh

      - name: Test Admin V11 CANARY evidence interface
        run: node scripts/test-admin-canary-evidence.mjs

      - name: Test Admin V11 direct proof and lost-response recovery
        run: node scripts/test-admin-canary-direct.mjs

      - name: Test read-only Auto-Matte provenance reconciliation fixtures
        run: python3 scripts/test-reconcile-automatte-provenance.py

      - name: Test Auto-Matte snapshot and import guard on disposable PostgreSQL
        run: |
          python3 scripts/test-snapshot-automatte-sqlite.py
          python3 scripts/test-build-automatte-dry-run-fixture.py
          bash scripts/test-automatte-provenance-import.sh
