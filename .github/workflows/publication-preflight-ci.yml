name: Publication preflight CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  publication-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Show preinstalled Node version
        run: node --version

      - name: Test batch limit and preflight
        run: node scripts/test-publication-batch-preflight.mjs

      - name: Test publication workflow safety
        run: node scripts/test-publication-workflow-safety.mjs

      - name: Test preserved Douai manual mode
        run: node scripts/test-publication-douai-manual.mjs

      - name: Test selected manual PREVIEW and EXECUTE
        run: node scripts/test-publication-manual-selected.mjs

      - name: Test publication incident observation
        run: node scripts/test-publication-incident-health.mjs

      - name: Test publication lifecycle recipes
        run: |
          node scripts/test-targeted-publication.mjs
          node scripts/test-event-edit-canonical-cleanup.mjs
          node scripts/test-publication-jobs-canonical.mjs
          node scripts/test-post-validation-publication.mjs
          node scripts/test-author-event-auto-refresh.mjs
          node scripts/test-publication-workflow-safety.mjs

      - name: Test pending DELETE coalescence on disposable PostgreSQL
        run: bash scripts/test-p0c3c-delete-pending.sh

      - name: Test atomic batch reservation on disposable PostgreSQL
        run: bash scripts/test-publication-batch-state.sh

      - name: Test CANARY source, quota and incident on disposable PostgreSQL
        run: bash scripts/test-publication-canary-sql.sh

      - name: Test Admin V11 CANARY evidence interface
        run: node scripts/test-admin-canary-evidence.mjs
