name: Admin Hotte Lab CI

on:
  pull_request:
    paths:
      - 'admin.html'
      - 'admin-v11.html'
      - 'admin-shell.js'
      - 'admin-context.js'
      - 'admin-v11.css'
      - 'scripts/test-admin-v11-ux-quickfix-browser.mjs'
      - 'tests/admin-origin.test.cjs'
      - 'admin-v11-hotte-tools.js'
      - 'admin-v11-hotte-tools.css'
      - 'scripts/test-admin-v11-hotte-*.mjs'
      - '.github/workflows/admin-hotte-lab-ci.yml'

permissions:
  contents: read

jobs:
  hotte-lab:
    name: Hotte widgets / isolated browser
    runs-on: ubuntu-latest
    # Pinned image: browser binaries + native WebKit libraries, no apt/distro DNS dependency.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 12
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static guards for V11 and Hotte
        run: |
          node --check admin-v11-hotte-tools.js
          node --test tests/admin-origin.test.cjs
          node --check scripts/test-admin-v11-hotte-browser.mjs
          node scripts/test-admin-v11-hotte-tools.mjs

      - name: Install isolated browser test dependencies
        run: npm install --ignore-scripts --no-save --package-lock=false playwright@1.62.1

      - name: Run isolated browser tests (external requests blocked)
        run: node scripts/test-admin-v11-hotte-browser.mjs

      - name: Test Hotte widgets in isolated WebKit (Safari engine)
        env:
          BROWSER_ENGINE: webkit
        run: node scripts/test-admin-v11-hotte-browser.mjs

      - name: Recheck V11 auth and login UX in isolated Chromium
        env:
          ADMIN_UX_PROOFS: hotte-auth-ui-evidence
        run: node scripts/test-admin-v11-ux-quickfix-browser.mjs

      - name: Recheck V11 auth and navigation under isolated WebKit (desktop + mobile 390px)
        env:
          BROWSER_ENGINE: webkit
          ADMIN_UX_PROOFS: hotte-auth-webkit-evidence
        run: node scripts/test-admin-v11-ux-quickfix-browser.mjs

      - name: Check real V11 routing with mocked authorized session
        env:
          ADMIN_UX_PROOFS: hotte-routed-ui-evidence
        run: node scripts/test-admin-v11-hotte-routed-browser.mjs

      - name: Recheck existing NFC cockpit fixtures
        run: node scripts/test-nfc-analytics-cockpit-v1.mjs

      - name: Preserve isolated visual proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotte-browser-evidence
          path: |
            hotte-browser-evidence/
            hotte-auth-ui-evidence/
            hotte-auth-webkit-evidence/
            hotte-routed-ui-evidence/
          if-no-files-found: ignore

  admin-event-write-disposable-pg:
    name: Admin V11 event edit / disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR (never production)
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and isolated dependencies
        run: |
          node --check admin-shell.js
          node --check scripts/test-admin-v11-event-write-pg-browser.mjs
          npm install --ignore-scripts --no-save --package-lock=false playwright@1.62.1 pg@8.16.3
          npx playwright install chromium
      - name: Real Admin edit -> fixture HTTP -> isolated PostgreSQL RLS -> rollback
        shell: bash
        env:
          PR278_DISPOSABLE_PG: "YES"
          PGHOST: "127.0.0.1"
          PGPORT: "55432"
          PGDATABASE: "postgres"
        run: |
          set -euo pipefail
          # Disposable container published exclusively on loopback.
          container=$(docker run --rm -d -p 127.0.0.1:55432:5432 \
            -e POSTGRES_PASSWORD=disposable-test-only postgres:17-alpine)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 45); do
            if docker exec "$container" pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec "$container" pg_isready -h 127.0.0.1 -U postgres
          node scripts/test-admin-v11-event-write-pg-browser.mjs
      - name: Preserve isolated edit and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-v11-event-write-disposable-pg
          path: pr278-disposable-pg-evidence/
          if-no-files-found: ignore

  baseline-publication-qualification:
    name: Publication fixture / main vs PR
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout PR with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compare retired-event test on unchanged main and PR
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p baseline-publication-evidence
          echo "PR HEAD: $(git rev-parse HEAD)"
          echo "BASE main: $(git rev-parse origin/main)"
          git worktree add --detach "$RUNNER_TEMP/hotte-main-baseline" origin/main
          set +e
          (cd "$RUNNER_TEMP/hotte-main-baseline" && node scripts/test-retired-test-policy.mjs) > baseline-publication-evidence/main.log 2>&1
          main_status=$?
          node scripts/test-retired-test-policy.mjs > baseline-publication-evidence/pr.log 2>&1
          pr_status=$?
          set -e
          printf 'main_exit=%s\npr_exit=%s\n' "$main_status" "$pr_status" | tee baseline-publication-evidence/status.txt
          grep -E 'Error: STOP|AssertionError|PASS retrait durable' baseline-publication-evidence/main.log | tail -n 5 || true
          grep -E 'Error: STOP|AssertionError|PASS retrait durable' baseline-publication-evidence/pr.log | tail -n 5 || true
          if [ "$main_status" -eq 0 ] && [ "$pr_status" -eq 0 ]; then
            echo "PASS: test passes on main and PR"
          elif [ "$main_status" -ne 0 ] && [ "$pr_status" -ne 0 ] &&
               grep -Fq "STOP projection ciblée : transition archives hors corpus publié ou date" baseline-publication-evidence/main.log &&
               grep -Fq "STOP projection ciblée : transition archives hors corpus publié ou date" baseline-publication-evidence/pr.log; then
            echo "QUALIFIED: same specific failure reproduces on main and PR; no evidence Hotte causes publication failure"
          else
            echo "FAIL: baseline and PR differ in outcome; investigate before merge"
            exit 1
          fi

      - name: Preserve baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotte-publication-baseline-evidence
          path: baseline-publication-evidence/
          if-no-files-found: ignore
