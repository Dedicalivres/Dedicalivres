name: Preview temporal catalogues

env:
  PYTHONDONTWRITEBYTECODE: "1"

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Same lock as publication: no overlapping source/projection workflows.
concurrency:
  group: dedicalivres-event-publication
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Project only published temporal catalogues
        run: python3 scripts/refresh-temporal-catalogues.py --output "$RUNNER_TEMP/temporal-preview"
      - name: Save complete validated projection for human review
        uses: actions/upload-artifact@v4
        with:
          name: temporal-catalogues-preview
          path: ${{ runner.temp }}/temporal-preview/
          if-no-files-found: error
