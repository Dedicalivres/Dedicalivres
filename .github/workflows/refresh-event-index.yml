name: Refresh event index

env:
  PYTHONDONTWRITEBYTECODE: "1"

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dedicalivres-event-publication
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh from published Event pages
        run: python3 scripts/event-publisher/refresh-index.py

      - name: Commit only the index and its sitemap date
        shell: bash
        run: |
          set -euo pipefail
          changes="$(git status --porcelain)"
          if [[ -z "$changes" ]]; then
            echo 'Index inchangé : aucun commit.'
            exit 0
          fi
          python3 scripts/event-publisher/refresh-index.py --verify-diff
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- evenement/index.html sitemap-evenements.xml
          git diff --cached --check
          git commit -m 'chore(catalogue): refresh current events index'
          git push origin HEAD:main
