name: Publish validated events

on:
  workflow_dispatch:
    inputs:
      preactivation_test:
        description: "Retired: use local isolated PostgreSQL tests; this input cannot publish"
        required: false
        default: false
        type: boolean

      recover_failed_p0:
        description: "Retired: historical P0 jobs must never be retried"
        required: false
        default: false
        type: boolean

      publish_douai:
        description: "Publish only the approved pending Douai job"
        required: false
        default: false
        type: boolean

      manual_mode:
        description: "Selected jobs: PREVIEW (read-only) or EXECUTE"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - execute

      manual_job_ids:
        description: "1 to 3 job UUIDs, separated by commas or spaces"
        required: false
        type: string

      manual_preview_fingerprint:
        description: "Exact fingerprint printed by PREVIEW (EXECUTE only)"
        required: false
        type: string

      manual_confirmation:
        description: "Type EXECUTE to confirm real publication (EXECUTE only)"
        required: false
        type: string

  schedule:
    - cron: "*/5 * * * *"


permissions:
  contents: write
  actions: read
  pages: write


concurrency:
  group: dedicalivres-event-publication
  cancel-in-progress: false


jobs:

  manual-preview:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          && inputs.manual_mode == 'preview'
          && inputs.publish_douai != true
          && inputs.preactivation_test != true
          && inputs.recover_failed_p0 != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SUPABASE_URL: https://pwyetrqyiaxpzjrafpvb.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.DEDICALIVRES_SUPABASE_SECRET_KEY }}
      PUBLICATION_AUTOMATION_ENABLED: ${{ vars.PUBLICATION_AUTOMATION_ENABLED }}
      PUBLICATION_MANUAL_MODE: preview
      PUBLICATION_MANUAL_JOB_IDS: ${{ inputs.manual_job_ids }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preview selected publication jobs (read-only)
        run: node scripts/publication-jobs.mjs preview-selected

  publish:

    if: >-
      ${{ inputs.preactivation_test != true
          && inputs.recover_failed_p0 != true
          && ((github.event_name == 'schedule'
               && vars.PUBLICATION_AUTOMATION_ENABLED == 'true')
              || (github.event_name == 'workflow_dispatch'
                  && inputs.publish_douai == true)
              || (github.event_name == 'workflow_dispatch'
                  && inputs.manual_mode == 'execute'
                  && inputs.publish_douai != true)) }}

    runs-on: ubuntu-latest

    timeout-minutes: 25

    env:
      SUPABASE_URL:
        https://pwyetrqyiaxpzjrafpvb.supabase.co

      SUPABASE_SECRET_KEY:
        ${{ secrets.DEDICALIVRES_SUPABASE_SECRET_KEY }}

      PUBLICATION_PREACTIVATION_TEST:
        "false"

      PUBLICATION_P0_RECOVERY:
        "false"

      PUBLICATION_AUTOMATION_ENABLED:
        ${{ vars.PUBLICATION_AUTOMATION_ENABLED }}

      PUBLICATION_DOUAI_MANUAL:
        ${{ github.event_name == 'workflow_dispatch' && inputs.publish_douai == true }}

      PUBLICATION_MANUAL_MODE:
        ${{ github.event_name == 'workflow_dispatch' && inputs.publish_douai != true && inputs.manual_mode || '' }}

      PUBLICATION_MANUAL_JOB_IDS:
        ${{ inputs.manual_job_ids }}

      PUBLICATION_MANUAL_FINGERPRINT:
        ${{ inputs.manual_preview_fingerprint }}

      PUBLICATION_MANUAL_CONFIRMATION:
        ${{ inputs.manual_confirmation }}

      PYTHONDONTWRITEBYTECODE: "1"


    steps:

      - name: Checkout main
        uses: actions/checkout@v4

        with:
          ref: main
          fetch-depth: 0


      - name: Preflight publication queue
        id: preflight

        env:
          GITHUB_TOKEN: ${{ github.token }}

        run: |
          node \
            scripts/publication-jobs.mjs \
            preflight


      - name: Configure Python cache
        if: steps.preflight.outputs.has_pending == 'true'
        run: |
          echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/dedicalivres-pycache" >> "$GITHUB_ENV"


      - name: Setup Node
        if: steps.preflight.outputs.has_pending == 'true'
        uses: actions/setup-node@v4

        with:
          node-version: "20"


      - name: Setup Python
        if: steps.preflight.outputs.has_pending == 'true'
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      - name: Read public Supabase configuration
        if: steps.preflight.outputs.has_pending == 'true'
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";

          const text =
            fs.readFileSync(
              "config.js",
              "utf8"
            );

          const url =
            text.match(
              /supabaseUrl\s*:\s*"([^"]+)"/
            )?.[1];

          const key =
            text.match(
              /supabaseAnonKey\s*:\s*"([^"]+)"/
            )?.[1];

          if (!url || !key) {
            throw new Error(
              "Configuration Supabase publique introuvable"
            );
          }

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `DEDICALIVRES_SUPABASE_URL=${url}\n`
          );

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `DEDICALIVRES_SUPABASE_PUBLISHABLE_KEY=${key}\n`
          );
          NODE


      - name: Install publisher dependencies
        if: steps.preflight.outputs.has_pending == 'true'
        run: |
          if [[ -s scripts/event-publisher/requirements.txt ]]
          then
            python -m pip install \
              -r scripts/event-publisher/requirements.txt
          fi


      - name: Claim publication jobs
        id: claim

        if: steps.preflight.outputs.has_pending == 'true'

        env:
          GITHUB_TOKEN: ${{ github.token }}

        run: |
          node \
            scripts/publication-jobs.mjs \
            claim


      - name: Generate static publication
        id: generate
        if: steps.claim.outputs.has_jobs == 'true'

        env:
          EVENT_PUBLISHER_EXPORT_DIR:
            ${{ runner.temp }}/dedicalivres-site-seo

          PUBLICATION_DEPUBLISH_PATHS:
            ${{ steps.claim.outputs.depublish_paths }}

          PUBLICATION_DEPUBLISH_EVENT_IDS:
            ${{ steps.claim.outputs.depublish_event_ids }}

          PUBLICATION_JOBS:
            ${{ steps.claim.outputs.publication_jobs }}

        run: |
          scripts/publish-events-cloud.sh


      - name: Validate generated scope
        id: scope
        if: steps.claim.outputs.has_jobs == 'true'

        env:
          PUBLICATION_DEPUBLISH_PATHS:
            ${{ steps.claim.outputs.depublish_paths }}

          PUBLICATION_JOBS:
            ${{ steps.claim.outputs.publication_jobs }}

          PUBLICATION_TARGETED: "true"

        run: |
          node \
            scripts/check-publication-diff.mjs

          git diff --check


      - name: Recheck public event source before push
        id: source_before
        if: steps.claim.outputs.has_jobs == 'true'

        env:
          EVENT_PUBLISHER_EXPORT_DIR:
            ${{ runner.temp }}/dedicalivres-site-seo

        run: |
          node scripts/verify-publication-source.mjs \
            "$EVENT_PUBLISHER_EXPORT_DIR/public-events-source.json"


      - name: Commit and push publication
        id: publish

        if: steps.claim.outputs.has_jobs == 'true'

        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if \
            git diff --quiet \
            && [[ -z "$(git status --porcelain)" ]]
          then
            echo \
              "changed=false" \
              >> "$GITHUB_OUTPUT"

            echo \
              "sha=$(git rev-parse HEAD)" \
              >> "$GITHUB_OUTPUT"

            echo \
              "Aucun changement statique nécessaire."

            exit 0
          fi

          git add -A

          git diff \
            --cached \
            --check

          git commit \
            -m "chore(publication): publish validated events"

          # Written before push: an interruption or rejected push
          # must not automatically requeue the batch.
          echo "commit_created=true" >> "$GITHUB_OUTPUT"

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          git push \
            origin \
            HEAD:main

          echo \
            "changed=true" \
            >> "$GITHUB_OUTPUT"


      # ==================================================
      # P0-C3-A — CORRECTION GITHUB PAGES
      #
      # A push authenticated with GITHUB_TOKEN does not
      # automatically trigger a GitHub Pages build.
      #
      # Request an explicit Pages build after a successful
      # push, before verifying production deployment.
      #
      # No request is made for a no-op publication.
      # ==================================================

      - name: Request GitHub Pages build
        id: pages_request
        if: steps.claim.outputs.has_jobs == 'true' && steps.publish.outputs.changed == 'true'

        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_SHA: ${{ steps.publish.outputs.sha }}

        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          echo "Vérification du commit distant..."

          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"

          if [[ "$remote_sha" != "$PUBLICATION_SHA" ]]; then
            echo "STOP : main ne correspond plus au commit attendu."
            exit 1
          fi

          echo "Vérification de la configuration GitHub Pages..."

          pages_config="$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/pages")"

          if ! jq -e \
            '.build_type == "legacy" and .source.branch == "main" and .source.path == "/"' \
            <<< "$pages_config" >/dev/null
          then
            echo "STOP : configuration GitHub Pages incompatible."
            echo "Configuration attendue : publication depuis main /."
            exit 1
          fi

          echo "Demande explicite de construction GitHub Pages..."

          response="$RUNNER_TEMP/pages-build-request.json"

          status="$(curl -sS \
            -o "$response" \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/pages/builds")"

          if [[ "$status" != "201" ]]; then
            echo "STOP : construction Pages refusée."
            echo "Code HTTP : $status"
            exit 1
          fi

          echo "Construction GitHub Pages demandée."
          echo "Commit : $PUBLICATION_SHA"


      # ==================================================
      # END P0-C3-A — CORRECTION GITHUB PAGES
      # ==================================================


      - name: Verify production deployment
        id: deployment

        if: steps.claim.outputs.has_jobs == 'true'

        env:
          PUBLICATION_SHA:
            ${{ steps.publish.outputs.sha }}

          PUBLICATION_JOBS:
            ${{ steps.claim.outputs.publication_jobs }}

          PUBLICATION_DEPUBLISH_PATHS:
            ${{ steps.claim.outputs.depublish_paths }}

          GITHUB_TOKEN:
            ${{ github.token }}

        run: |
          node scripts/verify-publication-deployment.mjs


      - name: Recheck source after deployment
        id: source_after
        if: steps.claim.outputs.has_jobs == 'true'

        env:
          EVENT_PUBLISHER_EXPORT_DIR:
            ${{ runner.temp }}/dedicalivres-site-seo

        run: |
          node scripts/verify-publication-source.mjs \
            "$EVENT_PUBLISHER_EXPORT_DIR/public-events-source.json"


      - name: Mark jobs successful
        id: finalize
        if: success() && steps.claim.outputs.has_jobs == 'true'

        env:
          PUBLICATION_JOBS:
            ${{ steps.claim.outputs.publication_jobs }}

          PUBLICATION_DEPLOYMENT_PROOF:
            ${{ steps.deployment.outputs.proof }}

        run: |
          node \
            scripts/publication-jobs.mjs \
            success \
            "${{ steps.claim.outputs.batch_id }}" \
            "${{ steps.publish.outputs.sha }}"


      - name: Requeue or fail jobs
        id: requeue
        if: >-
          ${{ failure() && steps.claim.outputs.has_jobs == 'true'
              && steps.publish.outcome != 'success'
              && steps.publish.outputs.commit_created != 'true' }}

        env:
          PUBLICATION_ERROR:
            GitHub Actions publication failed

          PUBLICATION_JOBS:
            ${{ steps.claim.outputs.publication_jobs }}

        run: |
          node \
            scripts/publication-jobs.mjs \
            fail \
            "${{ steps.claim.outputs.batch_id }}"


      - name: Hold uncertain publication for manual review
        id: uncertain
        if: >-
          ${{ failure() && steps.claim.outputs.has_jobs == 'true'
              && (steps.publish.outcome == 'success'
                  || steps.publish.outputs.commit_created == 'true') }}

        run: |
          echo "STOP : résultat du commit ou du déploiement incertain."
          echo "Le batch reste RUNNING ; vérifier GitHub Pages et le site avant toute reprise."
          exit 1


      - name: Persist automatic CANARY incident
        if: ${{ always() && github.event_name == 'schedule' && (failure() || cancelled()) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_CANARY_BATCH_ID: ${{ steps.claim.outputs.batch_id }}
          PUBLICATION_ERROR: >-
            ${{ steps.preflight.outcome == 'failure' && 'preflight'
                || steps.claim.outcome == 'failure' && 'reservation'
                || steps.generate.outcome == 'failure' && 'generation'
                || steps.scope.outcome == 'failure' && 'diff validation'
                || steps.source_before.outcome == 'failure' && 'source recheck before push'
                || steps.publish.outcome == 'failure' && 'commit or push'
                || steps.pages_request.outcome == 'failure' && 'Pages build request'
                || steps.deployment.outcome == 'failure' && 'Pages deployment verification'
                || steps.source_after.outcome == 'failure' && 'source recheck after deployment'
                || steps.finalize.outcome == 'failure' && 'Supabase finalization'
                || steps.requeue.outcome == 'failure' && 'failure finalization'
                || steps.uncertain.outcome == 'failure' && 'uncertain publication'
                || 'setup, cancellation, or unknown failure' }}
        run: node scripts/publication-jobs.mjs canary-incident
