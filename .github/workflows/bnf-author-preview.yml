name: BnF bibliographic candidate pilot
on:
  pull_request:
    paths:
      - 'scripts/preview_bnf_author.py'
      - 'scripts/test_preview_bnf_author.py'
      - '.github/workflows/bnf-author-preview.yml'
  workflow_dispatch:
jobs:
  fixture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test_preview_bnf_author.py
  live-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/preview_bnf_author.py --name 'Dylan Heskin' > bnf-candidates.json
      - uses: actions/upload-artifact@v4
        with:
          name: bnf-author-candidates
          path: bnf-candidates.json
          retention-days: 7
