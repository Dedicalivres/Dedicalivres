name: Preview seven missing author pages
on:
  pull_request:
    paths:
      - 'scripts/prepare-author-missing-preview.mjs'
      - 'scripts/test-author-missing-preview.mjs'
      - '.github/workflows/author-missing-preview.yml'
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-author-missing-preview.mjs
      - run: node scripts/prepare-author-missing-preview.mjs
      - name: Audit actual preview and all 26 pages
        run: node --test scripts/test-author-missing-preview.mjs
      - name: Verify tracked site untouched
        run: git diff --exit-code -- auteurs sitemap-seo-auteurs.xml
      - uses: actions/upload-artifact@v4
        with:
          name: seven-author-pages-preview
          path: .author-preview/
          include-hidden-files: true
          retention-days: 7
