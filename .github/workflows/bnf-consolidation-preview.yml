name: BnF consolidation isolated preview
on:
  pull_request:
    paths:
      - 'scripts/*bnf*'
      - 'scripts/*author-public-features*'
      - 'scripts/author-static-page.mjs'
      - 'author.html'
      - '.github/workflows/bnf-consolidation-preview.yml'
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-author-public-features.mjs
      - run: node scripts/test-author-bnf-cache-policy.mjs
      - run: node --test scripts/test-author-bnf-reviewed-gallery.mjs
      - run: node --test scripts/test-author-bnf-admin-review-draft.mjs
      - run: python3 scripts/test_preview_bnf_author.py
      - run: node --test scripts/test-author-presences-live.mjs
      - run: node scripts/test-author-seo-pages.mjs
      - run: node scripts/preview-author-bnf-gallery.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bnf-gallery-synthetic-preview
          path: bnf-preview-artifact/*.html
          retention-days: 7
