name: Author audio isolated preview
on:
  pull_request:
    paths:
      - 'scripts/*author-audio*'
      - 'docs/author-audio-*'
      - '.github/workflows/author-audio-preview.yml'
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/recipe-author-audio.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: author-audio-local-preview
          path: docs/author-audio-local-preview.html
          retention-days: 7
